<svg xmlns="http://www.w3.org/2000/svg" width="900" height="12" viewBox="0 0 900 12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd8a8"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="5" width="900" height="2" fill="url(#lineFade)" opacity="0.45"/>

  <rect x="0" y="4" width="150" height="4" rx="2" fill="url(#pulseGrad)">
    <animateTransform attributeName="transform" type="translate" values="-160 0; 900 0" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <path d="M442 6 L450 1 L458 6 L450 11 Z" fill="#ff7a18">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </path>
</svg>
