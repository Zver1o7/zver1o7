<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="Zver1o7 — fox run: fox jumps crates chasing rabbit">
  <defs>
    <linearGradient id="runFoxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
    <filter id="runGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff7a18" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="920" height="220" rx="14" fill="#0d1117" stroke="#ff7a18" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="30" y="30" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#8b949e">Zver1o7 :: FOX-RUN.EXE</text>
  <text x="890" y="30" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#ffb347">
    SCORE: 9001
    <animate attributeName="opacity" values="0.65;1;0.65" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- drifting contribution cells (parallax) -->
  <g opacity="0.55">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-1040 0" dur="16s" repeatCount="indefinite"/>
      <rect x="970" y="52" width="22" height="22" rx="5" fill="none" stroke="#30363d" stroke-width="2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-1040 0" dur="12s" repeatCount="indefinite"/>
      <rect x="960" y="108" width="22" height="22" rx="5" fill="#ff7a18" opacity="0.35"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-1040 0" dur="20s" repeatCount="indefinite"/>
      <rect x="985" y="80" width="18" height="18" rx="4" fill="#ffb347" opacity="0.3"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-1040 0" dur="26s" repeatCount="indefinite"/>
      <rect x="975" y="132" width="20" height="20" rx="5" fill="none" stroke="#30363d" stroke-width="2"/>
    </g>
  </g>

  <!-- ground -->
  <line x1="24" y1="170" x2="896" y2="170" stroke="#30363d" stroke-width="2"/>
  <line x1="20" y1="172" x2="900" y2="172" stroke="#21262d" stroke-width="6" stroke-dasharray="26 18">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="0.55s" repeatCount="indefinite"/>
  </line>

  <!-- crates: two, spaced half a loop -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-1080 0" dur="8s" repeatCount="indefinite"/>
    <rect x="930" y="136" width="34" height="34" rx="6" fill="#e8590c" stroke="#5a1f07" stroke-width="2"/>
    <line x1="930" y1="153" x2="964" y2="153" stroke="#5a1f07" stroke-width="2"/>
    <line x1="947" y1="136" x2="947" y2="170" stroke="#5a1f07" stroke-width="2"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-1080 0" dur="8s" begin="-4s" repeatCount="indefinite"/>
    <rect x="930" y="136" width="34" height="34" rx="6" fill="#e8590c" stroke="#5a1f07" stroke-width="2"/>
    <line x1="930" y1="153" x2="964" y2="153" stroke="#5a1f07" stroke-width="2"/>
    <line x1="947" y1="136" x2="947" y2="170" stroke="#5a1f07" stroke-width="2"/>
  </g>

  <!-- dust on fox landing -->
  <circle cx="601" cy="171" r="3" fill="#8b949e">
    <animate attributeName="opacity" values="0;0;0.85;0;0;0.85;0" keyTimes="0;0.355;0.368;0.45;0.855;0.868;0.95" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="623" cy="172" r="2" fill="#8b949e">
    <animate attributeName="opacity" values="0;0;0.7;0;0;0.7;0" keyTimes="0;0.36;0.373;0.46;0.86;0.873;0.96" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- fox: jumps over crates at 2.1s and 6.1s -->
  <g transform="translate(610,170)" filter="url(#runGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="spline"
        values="0 0;0 0;0 -46;0 0;0 0;0 -46;0 0;0 0"
        keyTimes="0;0.256;0.31;0.363;0.756;0.81;0.863;1"
        keySplines="0 0 1 1;0.15 0.9 0.5 1;0.5 0 0.85 0.15;0 0 1 1;0.15 0.9 0.5 1;0.5 0 0.85 0.15;0 0 1 1"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="0.38s" repeatCount="indefinite"/>
        <!-- tail -->
        <path d="M-30 -16 Q-50 -20 -54 -38 Q-46 -44 -36 -36 Q-38 -24 -28 -16 Z" fill="#ff7a18" stroke="#2b1105" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M-54 -38 Q-49 -43 -41 -39 L-43 -33 Q-51 -35 -54 -38 Z" fill="#fff3e0" stroke="#2b1105" stroke-width="1" stroke-linejoin="round"/>
        <!-- rear legs -->
        <g transform="translate(-24,-8)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#c9550d" stroke-width="4.5" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="38 0 0;-38 0 0;38 0 0" dur="0.4s" begin="0s" repeatCount="indefinite"/>
          </line>
        </g>
        <g transform="translate(-15,-8)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#e8590c" stroke-width="4.5" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="10 0 0;-30 0 0;10 0 0" dur="0.4s" begin="-0.13s" repeatCount="indefinite"/>
          </line>
        </g>
        <!-- body -->
        <path d="M-28 -28 Q-6 -34 14 -28 Q26 -24 24 -14 Q22 -8 12 -7 Q-8 -4 -22 -7 Q-32 -9 -32 -18 Q-32 -25 -28 -28 Z" fill="url(#runFoxGrad)" stroke="#2b1105" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- chest patch -->
        <path d="M12 -27 Q22 -24 22 -16 Q18 -9 10 -9 Q6 -16 12 -27 Z" fill="#fff3e0"/>
        <!-- front legs -->
        <g transform="translate(6,-8)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#c9550d" stroke-width="4.5" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="-30 0 0;30 0 0;-30 0 0" dur="0.4s" begin="-0.07s" repeatCount="indefinite"/>
          </line>
        </g>
        <g transform="translate(14,-8)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#e8590c" stroke-width="4.5" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="30 0 0;-25 0 0;30 0 0" dur="0.4s" begin="-0.27s" repeatCount="indefinite"/>
          </line>
        </g>
        <!-- head -->
        <path d="M10 -40 L36 -31 L28 -20 Q16 -14 6 -20 L6 -33 Z" fill="url(#runFoxGrad)" stroke="#2b1105" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- ears -->
        <path d="M14 -40 L20 -56 L27 -41 Z" fill="#ff7a18" stroke="#2b1105" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M17.5 -42 L20.5 -50 L24.5 -42 Z" fill="#5a2812"/>
        <path d="M6 -40 L7 -54 L16 -42 Z" fill="#d9480f" stroke="#2b1105" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- eye + nose -->
        <circle cx="20" cy="-31" r="2.2" fill="#1a0d06"/>
        <circle cx="20.8" cy="-31.8" r="0.7" fill="#ffd8a8"/>
        <circle cx="36" cy="-31" r="2.6" fill="#1a0d06"/>
      </g>
    </g>
  </g>

  <!-- rabbit: hops when crate passes -->
  <g transform="translate(780,170)" filter="url(#runGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="spline"
        values="0 0;0 0;0 -20;0 0;0 0;0 -20;0 0;0 0"
        keyTimes="0;0.11;0.158;0.21;0.615;0.662;0.71;1"
        keySplines="0 0 1 1;0.1 0.9 0.5 1;0.5 0 0.9 0.1;0 0 1 1;0.1 0.9 0.5 1;0.5 0 0.9 0.1;0 0 1 1"/>
      <!-- legs -->
      <g transform="translate(-10,-6)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#9aa4ae" stroke-width="3.5" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" values="20 0 0;-20 0 0;20 0 0" dur="0.34s" begin="0s" repeatCount="indefinite"/>
        </line>
      </g>
      <g transform="translate(0,-6)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#c9d1d9" stroke-width="3.5" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" values="-15 0 0;15 0 0;-15 0 0" dur="0.34s" begin="-0.17s" repeatCount="indefinite"/>
        </line>
      </g>
      <!-- body -->
      <path d="M-20 -10 Q-24 -19 -16 -22 Q-2 -27 8 -23 Q17 -21 16 -14 Q17 -8 10 -6 Q-8 -3 -16 -7 Q-21 -8 -20 -10 Z" fill="#d7dce2" stroke="#9aa4ae" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- head -->
      <path d="M6 -23 Q15 -31 20 -24 Q25 -17 18 -10 Q9 -8 5 -14 Q3 -19 6 -23 Z" fill="#d7dce2" stroke="#9aa4ae" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- ears -->
      <path d="M10 -27 Q6 -42 12 -45 Q18 -32 17 -26 Z" fill="#d7dce2" stroke="#9aa4ae" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M16 -25 Q18 -36 24 -38 Q26 -29 22 -21 Z" fill="#d7dce2" stroke="#9aa4ae" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- tail puff + face -->
      <circle cx="-20" cy="-15" r="3.5" fill="#f0f6fc" stroke="#9aa4ae" stroke-width="1"/>
      <circle cx="16" cy="-17" r="1.7" fill="#1a0d06"/>
      <circle cx="24" cy="-16" r="1.5" fill="#b96a4a"/>
    </g>
  </g>

  <text x="460" y="206" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#6e7681">SNAKE UNEMPLOYED &#8212; FOX IS HUNTING</text>
</svg>
