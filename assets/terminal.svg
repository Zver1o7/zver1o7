<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="terminal animation">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <clipPath id="winClip">
      <rect x="10" y="10" width="880" height="280" rx="12"/>
    </clipPath>
  </defs>

  <rect x="10" y="10" width="880" height="280" rx="12" fill="#161b22" stroke="#ff7a18" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="10" y="10" width="880" height="36" fill="#0d1117" clip-path="url(#winClip)"/>
  <line x1="10" y1="46" x2="890" y2="46" stroke="#30363d" stroke-width="1"/>

  <circle cx="34" cy="28" r="6.5" fill="#ff5f56"/>
  <circle cx="58" cy="28" r="6.5" fill="#ffbd2e"/>
  <circle cx="82" cy="28" r="6.5" fill="#27c93f"/>
  <text x="450" y="33" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#8b949e">zver@github &#8212; ~/dev &#8212; zsh</text>

  <!-- line 1: whoami (0.2s) -->
  <text x="36" y="80" font-family="Consolas, 'Courier New', monospace" font-size="17" opacity="0">
    <tspan fill="#ff9e2c">zver@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">whoami</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.017;0.025;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- line 2 (1.0s) -->
  <text x="36" y="110" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#ffd8a8" opacity="0">
    &gt; ZVER1O7 &#8212; game &amp; server dev
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.083;0.092;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- line 3: ls (2.0s) -->
  <text x="36" y="140" font-family="Consolas, 'Courier New', monospace" font-size="17" opacity="0">
    <tspan fill="#ff9e2c">zver@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">ls ./skills</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.167;0.175;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- line 4 (2.8s) -->
  <text x="36" y="170" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#ffd8a8" opacity="0">
    &gt; any game &#183; any engine &#183; any stack
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.233;0.242;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- line 5: status (3.8s) -->
  <text x="36" y="200" font-family="Consolas, 'Courier New', monospace" font-size="17" opacity="0">
    <tspan fill="#ff9e2c">zver@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">status</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.317;0.325;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- line 6: progress (4.6s) -->
  <text x="36" y="231" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#ffd8a8" opacity="0">
    &gt; building_worlds
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.383;0.392;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <rect x="246" y="219" width="190" height="12" rx="6" fill="#30363d" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.383;0.392;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="246" y="219" width="0" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" values="0;0;165;165" keyTimes="0;0.383;0.5;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="448" y="231" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#ff9e2c" opacity="0">
    87%
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.383;0.392;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- line 7: prompt + blinking cursor (5.2s) -->
  <text x="36" y="260" font-family="Consolas, 'Courier New', monospace" font-size="17" opacity="0">
    <tspan fill="#ff9e2c">zver@github</tspan><tspan fill="#8b949e">:~$ </tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.433;0.442;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <rect x="182" y="246" width="10" height="18" fill="#ff9e2c" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.433;0.442;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
